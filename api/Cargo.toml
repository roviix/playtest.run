[package]
name = "playtest-api"
version = "0.1.0"
description = "playtest 控制面：账号、slug、版本、清单、配额"
license = "AGPL-3.0-only"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "playtest_api"
path = "src/lib.rs"

[[bin]]
name = "playtest-api"
path = "src/main.rs"

[dependencies]
playtest-common = { path = "../common" }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
# 只用来读上传请求体的分片流；版本与 features 跟 axum 自己依赖的一致，不会多编一份。
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
rand = "0.9"
# bundled：把 SQLite 源码一起编进来，自托管的人不用先装 libsqlite3（DESIGN §7 一台机器跑通）。
rusqlite = { version = "0.40", features = ["bundled"] }
serde = "1"
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
# oneshot：测试直接把请求喂给 Router，不用起监听端口。
tower = { version = "0.5", features = ["util"] }
