<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>雨夜便利店 · Rainy Night Store</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0e14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #f8fafc; touch-action: none; user-select: none; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ui-layer { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 18px; z-index: 10; }
.top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
.store-tag { background: rgba(18, 22, 34, 0.82); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; padding: 8px 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
.store-title { font-size: 15px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 6px; }
.store-title .dot { width: 7px; height: 7px; border-radius: 50%; background: #57ad95; box-shadow: 0 0 8px #57ad95; }
.store-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }
.controls { display: flex; gap: 8px; pointer-events: auto; }
.btn-pill { background: rgba(18, 22, 34, 0.82); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.12); color: #e2e8f0; height: 36px; padding: 0 12px; border-radius: 18px; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; transition: transform .15s, background .15s; }
.btn-pill:active { transform: scale(0.95); }
.btn-pill.active { border-color: rgba(117, 205, 181, 0.5); background: rgba(117, 205, 181, 0.15); color: #75cdb5; }
.dialog-box { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); width: min(92%, 460px); background: rgba(20, 24, 36, 0.94); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 14px; padding: 14px 18px; box-shadow: 0 12px 30px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; }
.dialog-box.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
.dialog-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.dialog-who { font-size: 13px; font-weight: 600; color: #fbbf24; }
.dialog-close { background: none; border: none; color: #64748b; font-size: 16px; cursor: pointer; }
.dialog-text { font-size: 13.5px; line-height: 1.6; color: #e2e8f0; }
.bottom-dock { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: auto; }
.oden-menu { background: rgba(18, 22, 34, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 16px; padding: 10px 14px; display: flex; gap: 10px; overflow-x: auto; max-width: 100%; scrollbar-width: none; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
.oden-menu::-webkit-scrollbar { display: none; }
.oden-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); border: 1px solid transparent; cursor: pointer; transition: background .15s, transform .15s; white-space: nowrap; }
.oden-item:hover { background: rgba(255, 255, 255, 0.08); }
.oden-item:active { transform: scale(0.94); }
.oden-icon { font-size: 20px; }
.oden-name { font-size: 11.5px; color: #cbd5e1; font-weight: 500; }
.oden-price { font-size: 10.5px; color: #fbbf24; font-weight: 600; }
.toast-msg { background: rgba(15, 23, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 20px; padding: 8px 18px; font-size: 12.5px; color: #f1f5f9; pointer-events: none; opacity: 0; transition: opacity .3s, transform .3s; transform: translateY(6px); }
.toast-msg.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ui-layer">
  <div class="top-bar">
    <div class="store-tag">
      <div class="store-title"><span class="dot"></span>24H 雨夜便利店</div>
      <div class="store-sub">白炽灯、关东煮与屋檐落雨声</div>
    </div>
    <div class="controls">
      <button type="button" class="btn-pill" id="btn-bell" title="推开店门">
        <span>🔔 门铃</span>
      </button>
      <button type="button" class="btn-pill active" id="btn-radio" title="深夜收音机">
        <span id="radio-label">📻 Lo-fi 电台</span>
      </button>
    </div>
  </div>

  <div class="dialog-box" id="dialog-box">
    <div class="dialog-head">
      <span class="dialog-who" id="dialog-who">躲雨的客人</span>
      <button type="button" class="dialog-close" id="dialog-close">×</button>
    </div>
    <div class="dialog-text" id="dialog-text">“外面雨好大，幸好街角的便利店还亮着灯……”</div>
  </div>

  <div class="bottom-dock">
    <div class="toast-msg" id="toast-msg">已盛入碗中 · 温暖值 +10</div>
    <div class="oden-menu" id="oden-menu">
      <div class="oden-item" data-name="高汤大根萝卜" data-desc="吸收了满满柴鱼昆布高汤的白萝卜，入口即化。">
        <span class="oden-icon">🥢</span>
        <span class="oden-name">大根萝卜</span>
        <span class="oden-price">¥3</span>
      </div>
      <div class="oden-item" data-name="年糕福袋" data-desc="金黄豆皮里裹着软糯拉丝的年糕，热气腾腾。">
        <span class="oden-icon">🥟</span>
        <span class="oden-name">年糕福袋</span>
        <span class="oden-price">¥5</span>
      </div>
      <div class="oden-item" data-name="黄金溏心蛋" data-desc="卤香浓郁的溏心蛋，咬开流出醇厚蛋黄。">
        <span class="oden-icon">🥚</span>
        <span class="oden-name">溏心蛋</span>
        <span class="oden-price">¥3</span>
      </div>
      <div class="oden-item" data-name="高弹魔芋结" data-desc="清爽爽脆的魔芋丝结，裹着鲜辣芥末酱。">
        <span class="oden-icon">🍢</span>
        <span class="oden-name">魔芋结</span>
        <span class="oden-price">¥2</span>
      </div>
      <div class="oden-item" data-name="海苔鱼豆腐" data-desc="焦香滑嫩的四方鱼豆腐，每一口都是大海的鲜甜。">
        <span class="oden-icon">🟨</span>
        <span class="oden-name">鱼豆腐</span>
        <span class="oden-price">¥4</span>
      </div>
    </div>
  </div>
</div>

<script>
// --- Web Audio API 程序合成音效系统 ---
let audioCtx = null;
let rainGain = null;
let musicGain = null;
let isRadioPlaying = true;
let musicTimer = null;

function initAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;
  audioCtx = new AudioContext();

  // 1. 雨声白噪音发生器
  const bufferSize = audioCtx.sampleRate * 2;
  const rainBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = rainBuffer.getChannelData(0);
  let lastOut = 0.0;
  // Pink noise approximation for soothing rain
  for (let i = 0; i < bufferSize; i++) {
    const white = Math.random() * 2 - 1;
    data[i] = (lastOut + (0.02 * white)) / 1.02;
    lastOut = data[i];
    data[i] *= 3.5;
  }
  const rainSource = audioCtx.createBufferSource();
  rainSource.buffer = rainBuffer;
  rainSource.loop = true;

  const rainFilter = audioCtx.createBiquadFilter();
  rainFilter.type = 'lowpass';
  rainFilter.frequency.setValueAtTime(850, audioCtx.currentTime);

  rainGain = audioCtx.createGain();
  rainGain.gain.setValueAtTime(0.08, audioCtx.currentTime);

  rainSource.connect(rainFilter);
  rainFilter.connect(rainGain);
  rainGain.connect(audioCtx.destination);
  rainSource.start();

  // 2. Lo-fi 音乐和弦合成器
  musicGain = audioCtx.createGain();
  musicGain.gain.setValueAtTime(0.09, audioCtx.currentTime);
  musicGain.connect(audioCtx.destination);

  startLofiChords();
}

// 播放温暖的 Rhodes / Lo-fi 和弦
const CHORDS = [
  [293.66, 369.99, 440.00, 554.37], // Dmaj7
  [246.94, 293.66, 369.99, 440.00], // Bm7
  [329.63, 392.00, 493.88, 587.33], // Em7
  [220.00, 293.66, 369.99, 440.00]  // A7sus4
];
let chordIndex = 0;

function startLofiChords() {
  if (!audioCtx || !isRadioPlaying) return;
  const currentChord = CHORDS[chordIndex];
  chordIndex = (chordIndex + 1) % CHORDS.length;

  currentChord.forEach((freq, i) => {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = i === 0 ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.035, audioCtx.currentTime + 0.15 + i * 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.8);
      osc.connect(gain);
      gain.connect(musicGain);
      osc.start(audioCtx.currentTime + i * 0.04);
      osc.stop(audioCtx.currentTime + 2.9);
    } catch(e) {}
  });

  musicTimer = setTimeout(startLofiChords, 3200);
}

function playChimeBell() {
  initAudio();
  if (!audioCtx) return;
  const bellFreqs = [1046.5, 1318.5, 1567.98]; // C6, E6, G6
  bellFreqs.forEach((f, idx) => {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, audioCtx.currentTime + idx * 0.08);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime + idx * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 1.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + idx * 0.08);
      osc.stop(audioCtx.currentTime + idx * 0.08 + 1.25);
    } catch(e) {}
  });
}

function playSteamBubble() {
  initAudio();
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(420, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(750, audioCtx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.12);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.13);
  } catch(e) {}
}

// --- 客人故事库 ---
const GUESTS = [
  { who: "💼 赶末班地铁的白领", text: "“今天方案被客户改了整整七版。喝了一口热麦茶和关东煮热汤，好像又能坚持到明天了。”" },
  { who: "🎒 晚自习的高中生", text: "“末班公交刚刚开走了，不过没关系，便利店里总有一盏灯为夜归人留着。”" },
  { who: "🌧️ 程序员阿凯", text: "“刚合完最后一个紧急发布，听到窗外雨声就拐进来了。老板，来一份大根萝卜多加点高汤！”" },
  { who: "🎨 插画师小遥", text: "“下雨天的城市格外安静，最适合坐在靠窗的高脚椅上，看着玻璃上的水痕构思新画。”" },
  { who: "🐱 避雨的三花猫", text: "“喵~（在店门口的透明雨棚下抖了抖湿漉漉的毛，乖巧地趴在暖风出风口旁打盹）”" }
];
let guestIdx = 0;

// --- 画布与粒子场景 ---
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = window.innerWidth, H = window.innerHeight;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resize);
resize();

// 雨丝粒子
const rainDrops = [];
for (let i = 0; i < 160; i++) {
  rainDrops.push({
    x: Math.random() * W,
    y: Math.random() * H,
    len: Math.random() * 22 + 14,
    speed: Math.random() * 8 + 12,
    alpha: Math.random() * 0.4 + 0.2
  });
}

// 关东煮锅袅袅热气蒸汽粒子
const steams = [];
function spawnSteam(x, y) {
  steams.push({
    x: x + (Math.random() * 40 - 20),
    y: y,
    vx: (Math.random() - 0.5) * 0.6,
    vy: -(Math.random() * 1.2 + 1.0),
    r: Math.random() * 8 + 5,
    maxR: Math.random() * 32 + 20,
    alpha: 0.45
  });
}

// 玻璃凝结水珠
const windowDrops = [];
for (let i = 0; i < 45; i++) {
  windowDrops.push({
    x: Math.random() * W,
    y: Math.random() * H * 0.7,
    r: Math.random() * 3 + 1.5,
    trail: []
  });
}

// --- 渲染循环 ---
function render() {
  // 1. 背景：夜雨窗外街景
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#090b10');
  bgGrad.addColorStop(0.55, '#121622');
  bgGrad.addColorStop(1.0, '#1a1f2c');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // 2. 街灯光晕与雨夜倒影
  const lampX = W * 0.25;
  const lampY = H * 0.35;
  const lampGlow = ctx.createRadialGradient(lampX, lampY, 10, lampX, lampY, 220);
  lampGlow.addColorStop(0, 'rgba(251, 191, 36, 0.25)');
  lampGlow.addColorStop(0.5, 'rgba(245, 158, 11, 0.08)');
  lampGlow.addColorStop(1, 'rgba(245, 158, 11, 0)');
  ctx.fillStyle = lampGlow;
  ctx.fillRect(0, 0, W, H);

  // 3. 室外下落雨丝
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 1.2;
  for (const drop of rainDrops) {
    ctx.globalAlpha = drop.alpha;
    ctx.beginPath();
    ctx.moveTo(drop.x, drop.y);
    ctx.lineTo(drop.x - 2, drop.y + drop.len);
    ctx.stroke();

    drop.y += drop.speed;
    drop.x -= 1.5;
    if (drop.y > H) {
      drop.y = -20;
      drop.x = Math.random() * (W + 100);
    }
  }
  ctx.globalAlpha = 1.0;

  // 4. 便利店室内暖色高光 (落地大窗框与吧台)
  const windowY = H * 0.48;
  const counterH = H - windowY;

  // 木质吧台底座
  const counterGrad = ctx.createLinearGradient(0, windowY, 0, H);
  counterGrad.addColorStop(0, '#2b211b');
  counterGrad.addColorStop(0.08, '#453328');
  counterGrad.addColorStop(0.4, '#241a14');
  counterGrad.addColorStop(1.0, '#150f0c');
  ctx.fillStyle = counterGrad;
  ctx.fillRect(0, windowY, W, counterH);

  // 吧台边缘反光
  ctx.strokeStyle = 'rgba(255, 235, 180, 0.35)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, windowY);
  ctx.lineTo(W, windowY);
  ctx.stroke();

  // 5. 关东煮热锅台 (居中偏右)
  const potW = Math.min(W * 0.75, 340);
  const potH = 95;
  const potX = (W - potW) / 2;
  const potY = windowY + 28;

  // 不锈钢锅身
  ctx.fillStyle = '#333842';
  ctx.beginPath();
  ctx.roundRect(potX, potY, potW, potH, 8);
  ctx.fill();
  ctx.strokeStyle = '#4b5563';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 沸腾金黄高汤
  const soupPad = 8;
  const soupGrad = ctx.createLinearGradient(0, potY + soupPad, 0, potY + potH - soupPad);
  soupGrad.addColorStop(0, '#d97706');
  soupGrad.addColorStop(1, '#92400e');
  ctx.fillStyle = soupGrad;
  ctx.beginPath();
  ctx.roundRect(potX + soupPad, potY + soupPad, potW - soupPad * 2, potH - soupPad * 2, 4);
  ctx.fill();

  // 格子隔板
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 2;
  const cellW = (potW - soupPad * 2) / 3;
  for (let i = 1; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(potX + soupPad + cellW * i, potY + soupPad);
    ctx.lineTo(potX + soupPad + cellW * i, potY + potH - soupPad);
    ctx.stroke();
  }
  const midH = potY + potH / 2;
  ctx.beginPath();
  ctx.moveTo(potX + soupPad, midH);
  ctx.lineTo(potX + potW - soupPad, midH);
  ctx.stroke();

  // 汤中翻滚的小食材简绘
  ctx.fillStyle = '#fef3c7';
  ctx.beginPath();
  ctx.arc(potX + cellW * 0.5 + soupPad, potY + soupPad + 22, 12, 0, Math.PI * 2); // 萝卜
  ctx.fill();
  ctx.fillStyle = '#b45309';
  ctx.beginPath();
  ctx.roundRect(potX + cellW * 1.5 + soupPad - 12, potY + soupPad + 12, 24, 20, 4); // 福袋
  ctx.fill();
  ctx.fillStyle = '#fde68a';
  ctx.beginPath();
  ctx.arc(potX + cellW * 2.5 + soupPad, potY + soupPad + 22, 10, 0, Math.PI * 2); // 鸡蛋
  ctx.fill();

  // 生成蒸汽
  if (Math.random() < 0.35) {
    spawnSteam(potX + Math.random() * potW, potY + 8);
  }

  // 6. 蒸汽粒子动画
  for (let i = steams.length - 1; i >= 0; i--) {
    const s = steams[i];
    s.x += s.vx;
    s.y += s.vy;
    s.r += 0.35;
    s.alpha -= 0.008;

    if (s.alpha <= 0) {
      steams.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.globalAlpha = s.alpha;
    const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
    grad.addColorStop(0, 'rgba(255, 248, 220, 0.45)');
    grad.addColorStop(0.6, 'rgba(255, 255, 255, 0.15)');
    grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 7. 窗玻璃上的凝结雨滴
  for (const wd of windowDrops) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.beginPath();
    ctx.arc(wd.x, wd.y, wd.r, 0, Math.PI * 2);
    ctx.fill();

    if (Math.random() < 0.015) {
      wd.y += Math.random() * 2 + 1;
      if (wd.y > windowY) {
        wd.y = Math.random() * (windowY * 0.6);
      }
    }
  }

  requestAnimationFrame(render);
}

// --- 交互绑定 ---
const toastMsg = document.getElementById('toast-msg');
const dialogBox = document.getElementById('dialog-box');
const dialogWho = document.getElementById('dialog-who');
const dialogText = document.getElementById('dialog-text');
const dialogClose = document.getElementById('dialog-close');
const btnBell = document.getElementById('btn-bell');
const btnRadio = document.getElementById('btn-radio');
const radioLabel = document.getElementById('radio-label');

let toastTimeout = null;
function showToast(text) {
  toastMsg.textContent = text;
  toastMsg.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toastMsg.classList.remove('show'), 2600);
}

document.querySelectorAll('.oden-item').forEach(item => {
  item.addEventListener('click', () => {
    initAudio();
    playSteamBubble();
    const name = item.dataset.name;
    const desc = item.dataset.desc;
    showToast(`盛出「${name}」· ${desc}`);
  });
});

function triggerGuest() {
  initAudio();
  playChimeBell();
  const guest = GUESTS[guestIdx];
  guestIdx = (guestIdx + 1) % GUESTS.length;
  dialogWho.textContent = guest.who;
  dialogText.textContent = guest.text;
  dialogBox.classList.add('show');
}

btnBell.addEventListener('click', triggerGuest);
dialogClose.addEventListener('click', () => dialogBox.classList.remove('show'));

btnRadio.addEventListener('click', () => {
  initAudio();
  isRadioPlaying = !isRadioPlaying;
  btnRadio.classList.toggle('active', isRadioPlaying);
  if (isRadioPlaying) {
    radioLabel.textContent = '📻 Lo-fi 电台';
    startLofiChords();
    showToast('收音机：正在播放深夜暖心 Lo-fi 旋律');
  } else {
    radioLabel.textContent = '🌧️ 纯白噪音';
    clearTimeout(musicTimer);
    showToast('收音机：已切换为窗外雨声白噪音');
  }
});

// 首次点击或触屏激活音频
window.addEventListener('pointerdown', () => initAudio(), { once: true });

requestAnimationFrame(render);
</script>
</body>
</html>
