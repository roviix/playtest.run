# 一台机器跑通 playtest（DESIGN §7 承诺的自托管形态，也是我们自己的香港边缘）。
#
#   deploy/push.sh 会把镜像装载到主机、同步这个目录、然后在主机上：
#   SERVER_TAG=<标签> CADDY_TAG=<标签> docker compose up -d
#
# 变量来自同目录的 .env（只在服务器上，不入库；样例见 .env.example）。
name: playtest

services:
  caddy:
    image: playtest-caddy:${CADDY_TAG:-local}
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      API_HOST: ${API_HOST:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites.active:/etc/caddy/sites.active:ro
      - caddy_data:/data
      - caddy_config:/config
      - console_dist:/srv/console:ro
      - ./site:/srv/site:ro
    depends_on:
      - edge
      - api
      - console

  # 一次性容器：把控制台的静态产物拷进共享卷就退出。Caddy 从卷里托管 /console/。
  console:
    image: playtest-console:${CONSOLE_TAG:-local}
    restart: "no"
    volumes:
      - console_dist:/out
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: playtest-server:${SERVER_TAG:-local}
    command: ["playtest-api"]
    restart: unless-stopped
    # 进程只接 Ctrl-C 那个信号；compose 默认发 SIGTERM 会等满超时再强杀。
    stop_signal: SIGINT
    environment:
      PLAYTEST_API_LISTEN: 0.0.0.0:8787
      PLAYTEST_DATA_DIR: /data
      PLAYTEST_SITE_URL_TEMPLATE: ${PLAYTEST_SITE_URL_TEMPLATE}
      # 生产物料只写 S3；桶、区域或权限不对时进程直接起不来，不退回 /data/store。
      PLAYTEST_STORAGE_BACKEND: ${PLAYTEST_STORAGE_BACKEND:-s3}
      PLAYTEST_S3_BUCKET: ${PLAYTEST_S3_BUCKET}
      PLAYTEST_S3_REGION: ${PLAYTEST_S3_REGION}
      PLAYTEST_S3_ENDPOINT: ${PLAYTEST_S3_ENDPOINT:-}
      PLAYTEST_S3_PREFIX: ${PLAYTEST_S3_PREFIX:-}
      PLAYTEST_S3_ACCESS_KEY_ID: ${PLAYTEST_S3_API_ACCESS_KEY_ID:-}
      PLAYTEST_S3_SECRET_ACCESS_KEY: ${PLAYTEST_S3_API_SECRET_ACCESS_KEY:-}
      PLAYTEST_S3_SESSION_TOKEN: ${PLAYTEST_S3_API_SESSION_TOKEN:-}
      # GitHub 登录。空着 = 不提供登录，匿名链接照常。
      PLAYTEST_GITHUB_CLIENT_ID: ${PLAYTEST_GITHUB_CLIENT_ID:-}
      PLAYTEST_GITHUB_CLIENT_SECRET: ${PLAYTEST_GITHUB_CLIENT_SECRET:-}
      PLAYTEST_CONSOLE_URL: ${PLAYTEST_CONSOLE_URL:-}
      PLAYTEST_EMAIL_PROVIDER: ${PLAYTEST_EMAIL_PROVIDER:-off}
      # 发件人。空着 = playtest.run <notice@playtest.run>。
      PLAYTEST_EMAIL_FROM: ${PLAYTEST_EMAIL_FROM:-}
      # PLAYTEST_EMAIL_PROVIDER=resend 时必填。
      PLAYTEST_RESEND_API_KEY: ${PLAYTEST_RESEND_API_KEY:-}
      # PLAYTEST_EMAIL_PROVIDER=smtp 时必填，形如 smtps://用户名:密码@邮件服务器:465。
      PLAYTEST_SMTP_URL: ${PLAYTEST_SMTP_URL:-}
      # 玩家侧根域，信里的确认 / 退订 / 「我的」链接都从它拼。空着 = http://localhost:8443（只够本机用）。
      PLAYTEST_PUBLIC_ROOT_URL: ${PLAYTEST_PUBLIC_ROOT_URL:-}
      # 浏览器推送的联系方式，形如 mailto:hi@example.com；推送服务出问题时他们照这个找人。空着也能推。
      PLAYTEST_VAPID_SUBJECT: ${PLAYTEST_VAPID_SUBJECT:-}
      # 管理接口（赠送推广、手工撤下）。空着 = /admin/* 整组不注册，外面看到 404。
      PLAYTEST_ADMIN_TOKEN: ${PLAYTEST_ADMIN_TOKEN:-}
      # 只给同机边缘批量上报事件；API 与 edge 必须取同一份高熵值。
      PLAYTEST_EDGE_INGEST_TOKEN: ${PLAYTEST_EDGE_INGEST_TOKEN}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      # 只绑主机回环：API_HOST 没配时 CLI 走 ssh -L 隧道用；有了公网入口后仍留着给运维。
      - "127.0.0.1:8787:8787"
    volumes:
      - ${PLAYTEST_DATA_HOST_DIR:-/home/ubuntu/playtest-data}:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  edge:
    image: playtest-server:${SERVER_TAG:-local}
    command: ["playtest-edge"]
    restart: unless-stopped
    stop_signal: SIGINT
    environment:
      PLAYTEST_EDGE_LISTEN: 0.0.0.0:8443
      PLAYTEST_DATA_DIR: /data
      PLAYTEST_HOST_SUFFIX: ${PLAYTEST_HOST_SUFFIX}
      PLAYTEST_PUBLIC_SCHEME: ${PLAYTEST_PUBLIC_SCHEME:-https}
      PLAYTEST_STORAGE_BACKEND: ${PLAYTEST_STORAGE_BACKEND:-s3}
      PLAYTEST_S3_BUCKET: ${PLAYTEST_S3_BUCKET}
      PLAYTEST_S3_REGION: ${PLAYTEST_S3_REGION}
      PLAYTEST_S3_ENDPOINT: ${PLAYTEST_S3_ENDPOINT:-}
      PLAYTEST_S3_PREFIX: ${PLAYTEST_S3_PREFIX:-}
      # 可以给只读凭据：GetObject + ListBucket。没有静默共用 API 写凭据。
      PLAYTEST_S3_ACCESS_KEY_ID: ${PLAYTEST_S3_EDGE_ACCESS_KEY_ID:-}
      PLAYTEST_S3_SECRET_ACCESS_KEY: ${PLAYTEST_S3_EDGE_SECRET_ACCESS_KEY:-}
      PLAYTEST_S3_SESSION_TOKEN: ${PLAYTEST_S3_EDGE_SESSION_TOKEN:-}
      # 边缘的第一层事件每 60 秒送到控制面：同一台机器，走 compose 内网明文。
      PLAYTEST_API_INTERNAL_URL: http://api:8787
      PLAYTEST_EDGE_INGEST_TOKEN: ${PLAYTEST_EDGE_INGEST_TOKEN}
      # 玩家浏览器里的 SDK 往哪发事件（/_playtest/me 告诉它）。没有公网控制面时留空，SDK 会安静地不发。
      PLAYTEST_API_PUBLIC_URL: ${PLAYTEST_API_PUBLIC_URL:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      # 这里只留事件、流量账本和隧道离线记录；作品物料从 S3 读。
      - ${PLAYTEST_DATA_HOST_DIR:-/home/ubuntu/playtest-data}:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Host: ${PLAYTEST_HOST_SUFFIX}", "http://127.0.0.1:8443/_playtest/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  console_dist:
