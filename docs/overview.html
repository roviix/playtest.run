<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>playtest · 总览五图（故事 · 三条路 · 组件 · 结果与身份 · 边界）</title>
<style>
  :root{--bg:#f4f4f2;--bar:#fbfbfa;--line:#dcdcd8;--ink:#1c1d1f;--muted:#6c7075;--accent:#b5731a;--panel:#f8f8f6}

  header .brand small{font-weight:400;color:var(--muted);margin-left:8px}
  header .sep{width:1px;height:20px;background:var(--line)}
  button{font:inherit;font-size:12px;border:1px solid transparent;background:transparent;padding:4px 9px;border-radius:5px;cursor:pointer;color:var(--ink)}
  header button:hover{background:#ebebe8;border-color:#d4d4d0}
  header .zoom{min-width:50px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
  header .spacer{flex:1}
  header .hint{color:var(--muted);font-size:11.5px}
  aside,#right{background:var(--panel);overflow:auto}
  aside{border-right:1px solid var(--line)}#right{border-left:1px solid var(--line)}
  aside h3,#right h3{margin:0;padding:8px 12px;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:#f0f0ee}
  #toc{list-style:none;margin:0;padding:6px 0}
  #toc li{padding:5px 12px 5px 16px;cursor:pointer;display:flex;gap:8px;align-items:center;line-height:1.3}
  #toc li:hover{background:#ece9e2}#toc li.sel{background:#f6e6c8}
  #toc li i{display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid #999;flex:none}
  #toc li.group{color:var(--muted);font-size:11px;letter-spacing:.4px;cursor:default;margin-top:6px}
  #toc li.group:hover{background:transparent}
  main{position:relative;overflow:hidden;background:#fff}
  main svg{display:block;width:100%;height:100%;cursor:grab;user-select:none}
  main svg.panning{cursor:grabbing}
  #info{padding:12px 14px;line-height:1.65}

  #info .tag{display:inline-block;font-size:11px;color:#fff;border-radius:3px;padding:1px 7px;margin:0 6px 8px 0}
  #info ul{margin:0 0 10px;padding:0;list-style:none}
  #info ul li{padding:2px 0 2px 10px;border-left:2px solid #ddd;margin:2px 0}
  #info .desc p{margin:7px 0;font-size:13px}
  #info .ref{margin-top:10px;font-size:11.5px;color:var(--muted)}
  #info code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;background:#eee;padding:0 4px;border-radius:3px}
  footer{grid-column:1/4;display:flex;background:var(--bar);border-top:1px solid var(--line);padding-left:8px}
  footer button{border-radius:0;border:1px solid transparent;border-bottom:none;padding:0 14px;color:#444}
  footer button.active{background:#fff;border-color:var(--line);border-top:2px solid var(--accent);color:var(--ink);font-weight:600}
  footer button:hover:not(.active){background:#ececea}
  footer .pageinfo{margin-left:auto;padding:0 12px;display:flex;align-items:center;color:var(--muted);font-size:11.5px}
  .node{cursor:pointer}.node.static{cursor:default}
  .node.sel .shape{stroke-width:2.6px}
  .node .ring{display:none;fill:none;stroke:var(--accent);stroke-width:1.2;stroke-dasharray:4 3}
  .node.sel .ring{display:block}
  .edge{cursor:pointer}.edge.dim{opacity:.18}.edge.hi path.line{stroke-width:2.8px}
  .edge .lbl rect{fill:#fff;opacity:.95}.edge .lbl text{font-size:10.5px;fill:#222}.edge.hi .lbl text{font-weight:600}
  @media print{header,aside,#right,footer{display:none}#app{grid-template:1fr/1fr}}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">playtest<b>.run</b> · 总览五图<small id="hdr"></small></span>
    <span class="sep"></span>
    <button id="btnLeft">目录</button><button id="btnRight">说明</button>
    <span class="sep"></span>
    <button id="zoomOut">－</button><span class="zoom" id="zoomPct">100%</span><button id="zoomIn">＋</button>
    <button id="fit">适应</button><button id="one">100%</button>
    <span class="sep"></span>
    <button id="export">导出 SVG</button>
    <span class="spacer"></span>
    <span class="hint">拖动平移 · 滚轮缩放 · 点元素看出处 · 数字键 1–5 切图 · 每个结论对着 docs/DESIGN.md 的章节</span>
  </header>
  <aside><h3>本图元素</h3><ul id="toc"></ul></aside>
  <main id="canvas"></main>
  <div id="right"><h3>说明与出处</h3><div id="info"></div></div>
  <footer id="tabs"></footer>
</div>

<script>
// ---------------------------------------------------------------------------
// 颜色即角色。整套图只用这几种，图例每页都有。
// ---------------------------------------------------------------------------
const PAL = {
  person:['#ece3f3','#8b6aa8'],   // 人：开发者、玩家
  local: ['#f2f2f0','#6d6d6d'],   // 开发者电脑上的东西：CLI、dev server、目录
  player:['#dff0dc','#5f9a5a'],   // 玩家域 *.playtest.run：边缘、门禁页、广场
  dev:   ['#dbe7f7','#5f83b8'],   // 开发者域 playtest.roviix.com：控制面、控制台、介绍页
  fact:  ['#fff1cf','#c9a24a'],   // 对象存储里的事实：清单、blob、current.json、plaza.json、SQLite
  ext:   ['#ffe4cc','#d0862a'],   // 外部：GitHub、Cloudflare、微信、浏览器厂商
  no:    ['#f8d3cf','#b8524a'],   // 不做 / 硬线 / 风险
  white: ['#ffffff','#666666'],
};
const ROLE = {person:'人',local:'开发者的电脑',player:'玩家域 *.playtest.run',dev:'开发者域 playtest.roviix.com',fact:'对象存储 · 事实',ext:'外部',no:'不做 / 硬线 / 风险',white:'说明'};
const LEGEND = [['person','人'],['local','开发者的电脑'],['player','玩家域'],['dev','开发者域'],['fact','对象存储里的事实'],['ext','外部'],['no','不做 / 硬线 / 风险']];

// 元素构造器。x,y,w,h 是画布坐标；desc 是右侧说明（HTML）；ref 是出处。
const box  = (id,x,y,w,h,title,lines=[],color='white',o={}) => ({id,kind:'box',x,y,w,h,title,lines,color,...o});
const lane = (id,x,y,w,h,title,color='local',o={}) => ({id,kind:'lane',x,y,w,h,title,lines:[],color,...o});
const note = (id,x,y,w,h,title,lines=[],color='fact',o={}) => ({id,kind:'note',x,y,w,h,title,lines,color,...o});
const txt  = (id,x,y,text,o={}) => ({id,kind:'text',x,y,w:0,h:0,title:text,lines:[],...o});
const legend = (id,x,y) => ({id,kind:'legend',x,y,w:0,h:0,title:'图例',lines:[]});
// 连线：from/to 是元素 id 或 [x,y]；out/in 是出口/入口在矩形上的相对位置；via 是中途拐点。
const arrow = (from,to,label='',o={}) => ({from,to,label,color:'#4a4a4a',width:1.6,...o});

const pages = [];

// ===========================================================================
// 图 1 · 故事：七个时刻，一条命令
// ===========================================================================
(() => {
  const S=[], E=[];
  S.push(txt('t1',40,30,'图 1 · 故事：七个时刻，一条命令',{fs:21,bold:true}));
  S.push(txt('t2',430,36,'开发者手上有一个能玩的版本，想立刻放到别人面前，并且知道结果。「隧道」只是送过去的几种方式之一',{fs:13,color:'#555'}));
  S.push(legend('lg',40,62));

  S.push(lane('moments',40,96,1560,168,'§1.2 七个时刻 —— 产品从这张表倒推出来，不从技术出发','white',
    {desc:'<p>四类人（用 AI 写小东西的人、Game Jam 参与者、独立开发者、创意编码作者）的共同点：产物是浏览器里跑的东西，观众是具体的人。</p><p>时刻决定交付方式：M2 / M3 手上是导出目录 → 上传；M1 / M5 手上是跑着的进程 → 隧道。M2b 是零门槛的另一半——不光不用装，还得敢点。</p>',ref:'DESIGN §1.1 §1.2 §1.3'}));
  const M = [
    ['m1','M1 · 手机上试一下',['开发中，自己一个人','局域网 IP 是 HTTP，WebXR / 陀螺仪要 HTTPS'],'playtest 5173'],
    ['m2','M2 · 现在发给朋友看',['几个人，几分钟','zip 对方不会跑；部署要注册要等构建'],'playtest ./dist'],
    ['m2b','M2b · 让对方敢点开',['同一条链接，对方那一侧','exe 被 SmartScreen 拦；裸隧道链接弹警告'],'门禁页：真人名字 + 作品名'],
    ['m3','M3 · 找一批人测',['5–50 人，几天','不知道谁打开了、玩到哪、在哪坏的'],'点名册'],
    ['m3b','M3b · 有版本，没有人',['一个人，反复发生','「没人玩」比「发不出去」更常见'],'广场 --public / --seek'],
    ['m5','M5 · 带后端 / 联机的版本',['静态托管做不到','ngrok 在大陆不稳、frp 要 VPS'],'playtest 5173 或 ./dist --backend 3000'],
    ['m4','M4 · 正式发布',['永久页面、被发现、变现'],'不缺我们：itch · Steam · TapTap'],
  ];
  M.forEach((m,i)=>{
    const x = 60 + i*220;
    S.push(box(m[0],x,132,200,78,m[1],m[2],m[0]==='m4'?'no':'person',{small:true,ref:'DESIGN §1.2'}));
    S.push(box(m[0]+'a',x,218,200,34,m[3],[],m[0]==='m4'?'no':(m[0]==='m2b'||m[0]==='m3'||m[0]==='m3b'?'player':'local'),{small:true,
      desc: m[0]==='m4' ? '<p>发现、榜单、商店、变现是平台的事。广场（§3.8）是按时间排的告示板，不是这些。</p>' : '<p>这一格里 playtest 给的答案。</p>', ref:'DESIGN §1.3 · §3'}));
    E.push(arrow(m[0],m[0]+'a','',{out:[0.5,1],in:[0.5,0],width:1.2,noArrow:true}));
  });

  S.push(lane('story',40,296,1560,330,'一分钟的故事 —— 从敲下命令到看到「他们玩成了什么样」','white',
    {desc:'<p>「几秒」是写进验收的数字：CLI 结束时打印本次从敲命令到出二维码的耗时，P50 &lt; 5 s。</p><p>开发者因为「链接能开」来（本地能跑、传上去白屏，十年不愈），因为「不是黑箱」留下（送出去之后不知道结果，近一年爆发的最深的痛）。</p>',ref:'DESIGN §0 · §3.2 · §8 T1'}));
  const st = [
    ['s1','开发者敲命令',['playtest ./dist','playtest 5173','playtest ./dist --backend 3000'],'local',
      '<p>三种写法一个入口。目录→上传；端口→隧道；目录 + 后端端口→混合。CLI 按参数类型判断，开发者不用选。</p><p>没登录也能用：第一次拿到的是 24 小时匿名链接。</p>','DESIGN §3.2 · §4.3'],
    ['s2','链接 + 二维码',['https://brisk-otter-41.playtest.run','终端里直接画，手机扫就是 M1','本次 4.2 秒'],'local',
      '<p>stdout 只有那一行链接（<code>playtest ./dist | pbcopy</code> 拿到的就是它）；进度、二维码、提示全走 stderr。</p><p>上传那一刻做检查、用人话说：index.html 不在根、Godot 线程版没开 --isolated、.pck 漏了——「一定打不开」的会拦下。</p>','DESIGN §3.2 · §4.2「上传那一刻做检查」'],
    ['s3','对方点开：门禁页',['「某某 邀请你试玩《作品名》· v7」','一个「开始」按钮','1 秒内出现，几 KB，不引第三方脚本'],'player',
      '<p>它是这条链接的信任凭证（M2b）、浏览器要的用户手势（之后音频能播）、会话的起点（种 cookie）、版本告示牌、举报入口。隧道断了它变成「开发者的电脑暂时不在线」。</p><p>三条硬线见图 5。</p>','DESIGN §3.3'],
    ['s4','进入作品，玩',['.wasm / .br / COOP+COEP 边缘配好','同一 URL 不跳转','作品画面里永远没有我们的东西'],'player',
      '<p>对游戏有感的地方都在边缘的响应头里；这是开发者自己配 Nginx 最烦、通用托管不管的部分。</p>','DESIGN §4.2'],
    ['s5','开发者看点名册',['8 个人打开，6 个进到游戏','2 个在加载时走了——1 个微信 Android，wasm 下到 61% 中断','1 条反馈 · 附截图 · iPhone 15'],'dev',
      '<p>不是仪表盘，是点名册：计数和点名，不是百分比。每版一段话，点开是每人一行，按「停留最短」排——排最前的就是你要看的人。</p>','DESIGN §3.4'],
    ['s6','改一行，发第二版',['按内容哈希增量：只传变了的文件','v8；玩家链接不变','控制台一键回滚 = 指针指回去'],'local',
      '<p>「发第二版」是生死线的判据之一：私测 14 天，若一半以上开发者不回来发第二版，或每版平均打开人数不到 5，停。</p>','DESIGN §3.5 · §8'],
  ];
  st.forEach((s,i)=>{
    const x = 60 + i*255;
    S.push(box(s[0],x,338,235,120,s[1],s[2],s[3],{desc:s[4],ref:s[5]}));
    if (i) E.push(arrow(st[i-1][0],s[0],'',{out:[1,0.5],in:[0,0.5],width:1.8}));
  });
  E.push(arrow('s6','s3','玩家下次点开看到的就是 v8',{out:[0.5,1],in:[0.5,1],via:[[1452,500],[687,500]],color:'#5f9a5a',dashed:true,width:1.8,lx:1070,ly:500}));

  S.push(note('n1',60,530,480,80,'名字里的 playtest 兑现在「知道结果」',[
    '托管和隧道工具都停在「链接能开」，我们从「链接能开」开始。','开发者要的是一面镜子，不是一份名单：「这 3 个人停在第三关」，不是「37% 流失」。'],'fact',{ref:'DESIGN §0 第 4 条 · §3.4'}));
  S.push(note('n2',560,530,500,80,'玩家永远零门槛（硬约束）',[
    '不登录、不装东西、点开链接就能玩；广场上路过的人也算玩家，全程不登录。','任何改动若要求玩家登录、安装、或多一次跳转，先改 DESIGN。'],'no',{ref:'DESIGN §1.3 · AGENTS 第 6 条'}));
  S.push(note('n3',1080,530,500,80,'推演改了最初的三件事',[
    '「游戏版隧道」→ 隧道和上传是同一条命令的两条路；「发布」→「知道结果」；','边缘为隧道而建 → 边缘首先是对游戏有感的分发点，两条路都从它出去。'],'white',{ref:'DESIGN §0'}));

  pages.push({id:'story',title:'图 1 · 故事',sub:'七个时刻，一条命令，一分钟的故事',W:1640,H:650,shapes:S,edges:E});
})();

// ===========================================================================
// 图 2 · 三条路，一个链接
// ===========================================================================
(() => {
  const S=[], E=[];
  S.push(txt('t1',40,30,'图 2 · 三条路，一个链接',{fs:21,bold:true}));
  S.push(txt('t2',330,36,'上传、隧道、混合，共用同一种链接、同一个门禁页、同一套对游戏有感的响应头；「上传的清单」就是混合模式的分界线',{fs:13,color:'#555'}));
  S.push(legend('lg',40,62));

  S.push(lane('L_local',40,100,380,640,'开发者的电脑','local',{desc:'<p>CLI 是一个 Rust 单二进制：不走 npm、不依赖系统 ssh，「几秒」只在这个前提下成立。</p>',ref:'DESIGN §4.7'}));
  S.push(lane('L_cp',450,100,520,640,'控制面 playtest.roviix.com　+　对象存储（同一台机器的一个目录）','dev',{desc:'<p>控制面写清单和指针，边缘只读对象存储；两者之间没有 RPC。控制面挂了，已经发出去的链接照常能开。</p>',ref:'DESIGN §4.5'}));
  S.push(lane('L_edge',1000,100,600,640,'边缘 *.playtest.run　→　玩家的浏览器','player',{desc:'<p>边缘不认识控制面：读对象存储、验隧道令牌的公钥、每 60 秒把事件批量送回去。这是它能多地部署、单独扩的前提。</p>',ref:'DESIGN §4.4 §4.5'}));

  S.push(txt('la',60,134,'A · 上传（M2 / M3 · 导出目录）',{fs:12.5,bold:true,color:'#333'}));
  S.push(box('a_dir',60,170,160,56,'./dist',['引擎导出的静态目录'],'local'));
  S.push(box('a_cli',240,160,160,76,'playtest ./dist',['遍历 → 每个文件 SHA-256','问缺哪些 → 只传缺的 → 提交'],'local',
    {desc:'<p>四步：<code>POST /v1/projects</code> 拿 slug → <code>POST …/uploads</code> 送全部路径+哈希 → <code>PUT /v1/blobs/{hash}</code> 只传缺的（并行、可重试，服务端校验哈希）→ <code>POST …/commit</code> 得到 vN。改一行只传一个文件。</p>',ref:'DESIGN §4.2 · common/src/api.rs'}));
  S.push(box('a_api',470,160,220,76,'控制面 API',['缺哪些哈希 · 校验 · 提交清单','SQLite：用户 / slug / 版本 / 会话'],'dev',{ref:'api/src/routes/uploads.rs'}));
  S.push(box('a_blobs',720,140,230,44,'blobs/<hash>',['内容寻址，不可变，长缓存'],'fact',{small:true,ref:'common/src/store.rs'}));
  S.push(box('a_manifest',720,192,230,56,'manifests/<slug>/v7.json',['路径 → 哈希 · title · developer','expires_at · cover · engine'],'fact',{small:true,
    desc:'<p>清单不进数据库，进对象存储。它是版本本身：不可变、可回滚。登录归入账号时，重写的也是它（去掉 expires_at、换 developer）。</p>',ref:'common/src/manifest.rs'}));
  S.push(box('a_current',720,256,230,44,'current.json → v7',['「玩家现在看哪一版」的指针'],'fact',{small:true,desc:'<p>回滚就是把它指回去，一个字节不用重传，边缘 1 秒内看到。</p>',ref:'DESIGN §3.5'}));
  S.push(box('a_edge',1020,160,250,76,'边缘：按清单服务',['路径 → 哈希 → 对象','wasm MIME · 预压缩 .br · COOP/COEP · Range'],'player',{ref:'edge/src/app.rs · DESIGN §4.2'}));
  S.push(box('a_browser',1330,160,250,76,'玩家的浏览器',['门禁页 → 开始 → 作品','笔记本合盖也在'],'person'));
  E.push(arrow('a_dir','a_cli','',{out:[1,0.5],in:[0,0.5]}));
  E.push(arrow('a_cli','a_api','哈希 · 缺的字节 · 提交',{out:[1,0.5],in:[0,0.5],lx:435,ly:146}));
  E.push(arrow('a_api','a_blobs','',{out:[1,0.2],in:[0,0.5]}));
  E.push(arrow('a_api','a_manifest','写',{out:[1,0.55],in:[0,0.5],lx:705,ly:206}));
  E.push(arrow('a_api','a_current','',{out:[1,0.9],in:[0,0.5]}));

    const w = Math.max(...ls.map(l => tw(l, fs))) + 10, h = ls.length*fs*1.3 + 6;
    const lg = mk('g', {class:'lbl'}, grp);
    mk('rect', {x:lx-w/2, y:ly-h/2, width:w, height:h, rx:3}, lg);
    const t = mk('text', {x:lx, y:ly-h/2+4, 'text-anchor':'middle', 'dominant-baseline':'hanging'}, lg);
    ls.forEach((ln, i) => { const s = mk('tspan', {x:lx, dy:i?fs*1.3:0}, t); s.textContent = ln; });
  }
}

// ---------------------------------------------------------------------------
// 应用：分页、选择、平移缩放、导出
// ---------------------------------------------------------------------------
const canvas = document.getElementById('canvas');
let cur = 0, svg, view, tx = 0, ty = 0, sc = 1;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function build(i) {
  cur = i; const pg = pages[i];
  for (const k in byId) delete byId[k];
  pg.shapes.forEach(s => byId[s.id] = s);
  canvas.innerHTML = '';
  svg = mk('svg', {xmlns:NS}, canvas);
  const defs = mk('defs', {}, svg);
  for (const k in markers) delete markers[k];
  const grid = mk('pattern', {id:'grid', width:20, height:20, patternUnits:'userSpaceOnUse'}, defs);
  mk('path', {d:'M20 0 H0 V20', fill:'none', stroke:'#ebebe9', 'stroke-width':1}, grid);
  view = mk('g', {id:'view'}, svg);
  mk('rect', {x:-5000, y:-5000, width:14000, height:14000, fill:'#fff'}, view);
  mk('rect', {x:0, y:0, width:pg.W, height:pg.H, fill:'url(#grid)', stroke:'#c8c8c4'}, view);
  const gL = mk('g', {}, view), gE = mk('g', {}, view), gN = mk('g', {}, view);
  pg.shapes.filter(s => s.kind === 'lane').forEach(s => drawShape(gL, s));
  pg.edges.forEach((e, idx) => { try { drawEdge(gE, defs, e, idx); } catch (err) { console.warn(err.message); } });
  pg.shapes.filter(s => s.kind !== 'lane').forEach(s => drawShape(gN, s));
  document.getElementById('hdr').textContent = ' · ' + pg.title + ' — ' + pg.sub;
  document.querySelectorAll('#tabs button[data-i]').forEach(b => b.classList.toggle('active', +b.dataset.i === i));
  history.replaceState(null, '', '#' + pg.id);
  toc(pg); select(null); fit();
  svg.addEventListener('click', onClick);
  svg.addEventListener('mousedown', onDown);
  svg.addEventListener('wheel', onWheel, {passive:false});
}
function toc(pg) {
  const ul = document.getElementById('toc'); ul.innerHTML = '';
  for (const [name, f] of [['泳道', s => s.kind === 'lane'], ['元素', s => (s.kind === 'box' || s.kind === 'note') && s.title]]) {
    const items = pg.shapes.filter(f); if (!items.length) continue;
    const gh = document.createElement('li'); gh.className = 'group'; gh.textContent = name; ul.appendChild(gh);
    for (const s of items) {
      const li = document.createElement('li'); li.dataset.id = s.id;
      const ic = document.createElement('i'); const c = PAL[s.color] || PAL.white; ic.style.background = c[0]; ic.style.borderColor = c[1]; li.appendChild(ic);
      li.appendChild(document.createTextNode(s.title.length > 30 ? s.title.slice(0, 30) + '…' : s.title));
      li.onclick = () => { select(s.id); center(s); }; ul.appendChild(li);
    }
  }
}
function select(id) {
  svg.querySelectorAll('.node').forEach(n => n.classList.toggle('sel', n.dataset.id === id));
  svg.querySelectorAll('.edge').forEach(g => { const hit = id && (g.dataset.from === id || g.dataset.to === id); g.classList.toggle('hi', !!hit); g.classList.toggle('dim', !!id && !hit); });
  document.querySelectorAll('#toc li').forEach(li => li.classList.toggle('sel', li.dataset.id === id));
  const info = document.getElementById('info');
  if (!id) { info.innerHTML = `<p class="title">${esc(pages[cur].title)}</p><div class="desc"><p>${esc(pages[cur].sub)}</p><p>点任意矩形、便签或连线，右边给出它在 DESIGN / 代码里的出处。颜色即角色：紫是人，灰是开发者的电脑，绿是玩家域，蓝是开发者域，黄是对象存储里的事实，橙是外部，红是不做、硬线和风险。</p></div>`; return; }
  const s = byId[id]; const c = PAL[s.color] || PAL.white;
  const ls = (s.lines || []).map(l => `<li>${esc(l)}</li>`).join('');
  info.innerHTML = `<p class="title">${esc(s.title || '')}</p><span class="tag" style="background:${c[1]}">${ROLE[s.color] || ''}</span>` + (ls ? `<ul>${ls}</ul>` : '') + (s.desc ? `<div class="desc">${s.desc}</div>` : '') + (s.ref ? `<div class="ref">出处：${esc(s.ref)}</div>` : '');
}
function showEdge(e) {
  const name = r => Array.isArray(r) ? '（点）' : (byId[r]?.title || r);
  document.getElementById('info').innerHTML = `<p class="title">连线</p><div class="desc"><p><b>${esc(name(e.from))}</b> → <b>${esc(name(e.to))}</b></p>${e.label ? `<p>${esc(e.label)}</p>` : ''}${e.dashed ? '<p style="color:#777">虚线：只读 / 可选 / 回环</p>' : ''}</div>`;
}
let dragging = false, moved = false, sx = 0, sy = 0, tx0 = 0, ty0 = 0;
function onClick(ev) {
  if (moved) return;
  const n = ev.target.closest('.node'), e = ev.target.closest('.edge');
  if (n && !n.classList.contains('static')) { select(n.dataset.id); return; }
  if (e) { select(null); svg.querySelectorAll('.edge').forEach(g => { g.classList.toggle('hi', g === e); g.classList.toggle('dim', g !== e); }); showEdge(pages[cur].edges[+e.dataset.idx]); return; }
  select(null);
}
function apply() { view.setAttribute('transform', `translate(${tx} ${ty}) scale(${sc})`); document.getElementById('zoomPct').textContent = Math.round(sc*100) + '%'; }
function onDown(ev) { if (ev.button !== 0) return; dragging = true; moved = false; sx = ev.clientX; sy = ev.clientY; tx0 = tx; ty0 = ty; svg.classList.add('panning'); }
window.addEventListener('mousemove', ev => { if (!dragging) return; const dx = ev.clientX-sx, dy = ev.clientY-sy; if (Math.abs(dx)+Math.abs(dy) > 3) moved = true; tx = tx0+dx; ty = ty0+dy; apply(); });
window.addEventListener('mouseup', () => { dragging = false; svg && svg.classList.remove('panning'); setTimeout(() => moved = false, 0); });
function onWheel(ev) { ev.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(ev.clientX-r.left, ev.clientY-r.top, Math.exp(-ev.deltaY*0.0015)); }
function zoomAt(px, py, f) { const ns = Math.min(4, Math.max(0.2, sc*f)), k = ns/sc; tx = px-(px-tx)*k; ty = py-(py-ty)*k; sc = ns; apply(); }
function fit() { const pg = pages[cur], r = canvas.getBoundingClientRect(); sc = Math.min((r.width-40)/pg.W, (r.height-40)/pg.H); tx = (r.width-pg.W*sc)/2; ty = (r.height-pg.H*sc)/2; apply(); }
function center(s) { const r = canvas.getBoundingClientRect(); tx = r.width/2-(s.x+(s.w||0)/2)*sc; ty = r.height/2-(s.y+(s.h||0)/2)*sc; apply(); }
document.getElementById('zoomIn').onclick = () => { const r = canvas.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1.2); };
document.getElementById('zoomOut').onclick = () => { const r = canvas.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1/1.2); };
document.getElementById('fit').onclick = fit;
document.getElementById('one').onclick = () => { const r = canvas.getBoundingClientRect(); const cx = (r.width/2-tx)/sc, cy = (r.height/2-ty)/sc; sc = 1; tx = r.width/2-cx; ty = r.height/2-cy; apply(); };
document.getElementById('btnLeft').onclick = () => { document.getElementById('app').classList.toggle('no-left'); setTimeout(fit, 0); };
document.getElementById('btnRight').onclick = () => { document.getElementById('app').classList.toggle('no-right'); setTimeout(fit, 0); };
document.getElementById('export').onclick = () => {
  const pg = pages[cur], clone = svg.cloneNode(true);
  clone.setAttribute('width', pg.W); clone.setAttribute('height', pg.H); clone.setAttribute('viewBox', `0 0 ${pg.W} ${pg.H}`);
  clone.querySelector('#view').setAttribute('transform', '');
  clone.querySelectorAll('.ring').forEach(n => n.remove());
  const style = document.createElementNS(NS, 'style');
  style.textContent = `text{font-family:${getComputedStyle(document.body).fontFamily}} .lbl rect{fill:#fff}`;
  clone.insertBefore(style, clone.firstChild);
  const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone)], {type:'image/svg+xml'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `playtest-${pg.id}.svg`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
const tabs = document.getElementById('tabs');
pages.forEach((pg, i) => { const b = document.createElement('button'); b.dataset.i = i; b.textContent = pg.title; b.onclick = () => build(i); tabs.appendChild(b); });
const pi = document.createElement('div'); pi.className = 'pageinfo'; pi.textContent = '与 docs/DESIGN.md 同步 · 方向变了先改 DESIGN 再改这张图'; tabs.appendChild(pi);
window.addEventListener('keydown', ev => { if (ev.target.tagName === 'INPUT') return; const k = ev.key;
  if (k >= '1' && k <= '5') build(+k-1); else if (k === '+' || k === '=') document.getElementById('zoomIn').click(); else if (k === '-') document.getElementById('zoomOut').click(); else if (k === '0') fit(); else if (k === 'Escape') select(null); });
window.addEventListener('resize', fit);
const start = pages.findIndex(p => '#' + p.id === location.hash);
build(start < 0 ? 0 : start);
</script>
