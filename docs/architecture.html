  <text x="2550" y="1466" text-anchor="middle" class="small">JS 错误 · 加载用时 · 自定义事件</text>

  <!-- ===== 2 两条路 ===== -->
  <rect x="80" y="1880" width="2800" height="1000" rx="8" class="panel"/>
  <circle cx="126" cy="1932" r="26" class="rough" stroke="#2e4d72" stroke-width="3"/>
  <text x="126" y="1943" text-anchor="middle" font-size="29" font-weight="700" class="navy">2</text>
  <text x="176" y="1946" class="panel-title">两条路，一种链接</text>
  <text x="620" y="1943" class="body muted">同一个 &lt;slug&gt;.playtest.run，上传或隧道对玩家透明；一个作品两条都走过时，隧道离线就退回上传的版本</text>

  <rect x="180" y="2010" width="1300" height="520" rx="6" class="box soft-navy"/>
  <text x="830" y="2072" text-anchor="middle" class="h navy">上传 · playtest ./dist</text>
  <text x="830" y="2110" text-anchor="middle" class="small">M2 发给朋友 · M3 找一批人测 —— 多数场景，引擎导出物就是一个静态目录</text>
  <text x="225" y="2172" class="body">① 遍历目录，每个文件算 SHA-256，顺手检查导出物（index.html 在不在最外层、要不要 --isolated）</text>
  <text x="225" y="2220" class="body">② 问控制面：这些哈希缺哪些？　→　只传缺的（并行、可重试、服务端复核哈希）</text>
  <text x="225" y="2268" class="body">③ 提交清单 → 得到 v7；「当前版本」指针指向它，回滚就是把指针指回去</text>
  <path d="M225 2300 C600 2290 1100 2310 1440 2298" class="rough" stroke="#2e4d72" stroke-width="3"/>
  <text x="225" y="2356" class="body" font-weight="700">边缘按清单服务：路径 → 哈希 → blob</text>
  <text x="225" y="2400" class="body">.wasm → application/wasm　·　.br / .gz 直接给并加 Content-Encoding　·　--isolated → COOP/COEP　·　Range 206</text>
  <text x="225" y="2448" class="body">对象不可变、按内容去重；改一行代码只传一个文件，几秒完成</text>
  <text x="830" y="2504" text-anchor="middle" class="small">实测：7 个文件 45 KB 冷上传 1.0 秒；服务器已有全部文件时 24 ms</text>

  <rect x="1580" y="2010" width="1200" height="520" rx="6" class="box soft-amber"/>
  <text x="2180" y="2072" text-anchor="middle" class="h amberink">隧道 · playtest 5173</text>
  <text x="2180" y="2110" text-anchor="middle" class="small">M1 手机上试一下 · M5 带后端或联机 —— 正在跑的进程，只能这样</text>
  <text x="1625" y="2172" class="body">① 向控制面要一个隧道令牌（Ed25519，一小时，活不过作品）</text>
  <text x="1625" y="2220" class="body">② 开一条出站 WSS 到 &lt;slug&gt;.playtest.run，边缘只验公钥、不回源</text>
  <text x="1625" y="2268" class="body">③ 边缘为每个玩家开一条 yamux 流，CLI 连 127.0.0.1:5173 双向拷贝</text>
  <path d="M1625 2300 C1900 2290 2500 2310 2740 2298" class="rough" stroke="#8a6a1f" stroke-width="3"/>
  <text x="1625" y="2356" class="body" font-weight="700">Host 改成 localhost:5173（Vite 6 只放行它），原值放 X-Forwarded-Host</text>
  <text x="1625" y="2400" class="body">响应头同样补齐，响应体一个字节不动　·　101 之后就是字节对拷，WebSocket 天然透传</text>
  <text x="1625" y="2448" class="body">断了 1→30 秒退避重连，链接不变　·　新进程挤掉旧的（4001）　·　离线 → 「上次在线 12:40」</text>
  <text x="2180" y="2504" text-anchor="middle" class="small">实测：socket.io 联机房间 14 条自检穿香港隧道全过；边缘重启后 1 秒重连</text>

  <rect x="180" y="2590" width="2600" height="230" rx="6" class="box soft-green"/>
  <text x="1480" y="2650" text-anchor="middle" class="h green">为什么大文件走上传、小请求走隧道</text>
  <text x="1480" y="2706" text-anchor="middle" class="body">隧道走开发者的家宽上行（普遍 30–50 Mbps）：一个 32 MB 的 Unity 包一个玩家等 9 秒，十个人同时进来更久</text>
  <text x="1480" y="2752" text-anchor="middle" class="body">上传一次，玩家从边缘直接拿；隧道上剩下的多数是小请求和 WebSocket —— 单条 TCP 的队头阻塞就不那么疼</text>
  <text x="1480" y="2796" text-anchor="middle" class="small">CLI 看到目录体积会把这个数字算出来说给你听，而不是让你自己猜</text>

<script>
(() => {
  const board = document.getElementById('board');
  const width = 2960;
  let zoom = Math.min(1, Math.max(.3, (window.innerWidth - 20) / width));
  const apply = () => { board.style.zoom = zoom; };
  document.getElementById('zi').onclick = () => { zoom = Math.min(2.5, zoom * 1.2); apply(); };
  document.getElementById('zo').onclick = () => { zoom = Math.max(.2, zoom / 1.2); apply(); };
  document.getElementById('zf').onclick = () => { zoom = Math.min(1, Math.max(.2, (window.innerWidth - 20) / width)); apply(); };
  apply();
})();
</script>
