# 打一个 v* 标签就把 `playtest` 命令行编成三平台的单文件，挂到 GitHub Release 上。
# 只发 CLI：边缘与控制面在服务器上用 deploy/ 构建，不发预编译包（DESIGN §7：托管部署形态公开，密钥私有）。
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# 同一批产物再传一份到 R2（dl.roviix.com），install.sh 优先从那里下载；VERSION 文件让 install.sh 不问 GitHub 就知道最新版本。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       target: aarch64-apple-darwin,      archive: tar.gz }
          - { os: macos-14,       target: x86_64-apple-darwin,       archive: tar.gz }
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-musl, archive: tar.gz }
          - { os: ubuntu-22.04,   target: aarch64-unknown-linux-musl, archive: tar.gz }
          - { os: windows-2022,   target: x86_64-pc-windows-msvc,    archive: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # musl：静态链接，任何 Linux 发行版直接跑，不依赖 glibc 版本。aarch64 musl 要交叉链接器。
      - if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
          if [[ "${{ matrix.target }}" == aarch64-* ]]; then
            sudo apt-get install -y -q gcc-aarch64-linux-gnu
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
          fi
      - run: cargo build -p playtest --release --locked --target ${{ matrix.target }}
      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="playtest-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          printf '{"version":"%s","commit":"%s","target":"%s"}\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" '${{ matrix.target }}' > "dist/$name/build-info.json"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/playtest.exe" "dist/$name/"
            cp LICENSE README.md "dist/$name/"
            (cd dist && 7z a -bd "$name.zip" "$name" >/dev/null)
          else
            cp "target/${{ matrix.target }}/release/playtest" "dist/$name/"
            cp LICENSE README.md "dist/$name/"
            (cd dist && tar -czf "$name.tar.gz" "$name")
          fi
          # 只算压缩包本身；`$name.*` 会把正在写的 .sha256 也算进去。
          archive="$name.${{ matrix.archive }}"
          (cd dist && (shasum -a 256 "$archive" 2>/dev/null || sha256sum "$archive") > "$name.sha256")
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-22.04
    env:
      # 步骤自己的 env 在它的 if 里看不见，secrets 在 if 里也不能直接用；先在 job 层算成一个布尔。
      HAS_R2: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 合并校验文件
        run: |
          cd dist && cat *.sha256 > SHA256SUMS && rm -f *.sha256
          printf '%s\n' "$GITHUB_REF_NAME" > VERSION
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            macOS / Linux 一行安装（自动选平台、校验 SHA-256、装到 `~/.local/bin`）：

            ```
            curl -fsSL https://playtest.run/install.sh | bash
            ```

            Windows 下载下面的 zip，把 `playtest.exe` 放到 PATH。macOS 第一次运行若被拦，
            在「系统设置 → 隐私与安全性」里放行一次（尚未签名与公证）。

            边缘与控制面不发预编译包，部署方式见 `deploy/README.md`。

            `SHA256SUMS` 用于下载完整性校验；每个压缩包包含 `build-info.json`，记录标签、源码提交和目标平台。
            文件校验不是代码签名。

      - name: 上传安装包到 Cloudflare R2 (dl.roviix.com)
        if: env.HAS_R2 == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'nexus-desktop' }}
          DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL || 'https://dl.roviix.com/files' }}
        run: |
          deploy/upload-release-to-r2.sh --input dist

